name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Check version fields stay in sync
        run: |
          cargo_v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          plugin_v=$(jq -r .version .claude-plugin/plugin.json)
          npm_v=$(jq -r .version npm/package.json)
          server_v=$(jq -r .version server.json)
          server_pkg_v=$(jq -r '.packages[0].version' server.json)
          echo "Cargo.toml=$cargo_v plugin.json=$plugin_v npm/package.json=$npm_v server.json=$server_v/$server_pkg_v"
          for v in "$plugin_v" "$npm_v" "$server_v" "$server_pkg_v"; do
            if [ "$v" != "$cargo_v" ]; then
              echo "Version mismatch: expected $cargo_v everywhere"
              exit 1
            fi
          done

  verify-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Build
        run: cargo build --release

  verify-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install plugin dependencies
        working-directory: plugin
        run: bun install --frozen-lockfile

      - name: Test plugin
        run: make test-ts

      - name: Build plugin
        run: make build-ts
